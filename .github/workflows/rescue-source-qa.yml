name: LIVE RESCUE - Source QA Godot
on:
  push:
    branches:
      - production/characters-and-rescue-3d
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test bridge
        working-directory: rescue/bridge
        run: npm ci --no-audit --no-fund && npm test
      - name: Fetch pinned Godot editor
        run: |
          set -euo pipefail
          curl -fL --retry 3 --connect-timeout 20 https://github.com/godotengine/godot/releases/download/4.5.2-stable/Godot_v4.5.2-stable_linux.x86_64.zip -o godot.zip
          unzip -q godot.zip
          chmod +x Godot_v4.5.2-stable_linux.x86_64
      - name: Import and run every Godot suite
        run: python3 rescue/tools/run-godot-qa.py --godot ./Godot_v4.5.2-stable_linux.x86_64 --output qa-logs
      - name: Verify integration contracts
        run: node rescue/tools/production-preflight.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RESCUE-SOURCE-QA
          path: qa-logs/
