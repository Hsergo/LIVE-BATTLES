name: MISSION SAUVETAGE LIVE — Windows
# User authorized compilation after implementation and source validation.
# Ordinary production commits still do not export Windows.
on:
  workflow_dispatch:
  push:
    branches:
      - release/rescue-v0.5-20261119
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Test bridge and source contracts
        run: |
          $ErrorActionPreference = 'Stop'
          Push-Location rescue/bridge
          npm ci --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { throw 'npm ci failed' }
          npm test
          if ($LASTEXITCODE -ne 0) { throw 'Bridge tests failed' }
          Pop-Location
          node rescue/tools/production-preflight.js
          if ($LASTEXITCODE -ne 0) { throw 'Preflight failed' }
      - name: Prepare pinned Godot and Windows templates
        run: |
          $ErrorActionPreference = 'Stop'
          $url = 'https://github.com/godotengine/godot/releases/download/4.5.2-stable'
          Invoke-WebRequest "$url/Godot_v4.5.2-stable_win64.exe.zip" -OutFile godot.zip
          Expand-Archive godot.zip tools/rescue-godot -Force
          Invoke-WebRequest "$url/Godot_v4.5.2-stable_export_templates.tpz" -OutFile templates.zip
          Expand-Archive templates.zip tools/rescue-templates -Force
          $destination = Join-Path $env:APPDATA 'Godot/export_templates/4.5.2.stable'
          New-Item -ItemType Directory -Force $destination | Out-Null
          Copy-Item tools/rescue-templates/templates/* $destination -Recurse -Force
          $godot = (Get-ChildItem tools/rescue-godot -Recurse -Filter '*_win64_console.exe' | Select-Object -First 1).FullName
          if (-not $godot) { throw 'Godot console missing' }
          "RESCUE_GODOT=$godot" | Out-File $env:GITHUB_ENV -Append -Encoding utf8
      - name: Import resources and run every Godot suite
        run: |
          python rescue/tools/run-godot-qa.py --godot $env:RESCUE_GODOT --output qa-logs
          if ($LASTEXITCODE -ne 0) { throw 'Godot source tests failed' }
      - name: Export release executable
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist-rescue/game | Out-Null
          & $env:RESCUE_GODOT --headless --path rescue/game --export-release 'Windows Desktop' (Join-Path $PWD 'dist-rescue/game/MissionSauvetage.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Windows export failed' }
          foreach ($name in @('MissionSauvetage.exe','MissionSauvetage.pck')) {
            if (-not (Test-Path "dist-rescue/game/$name")) { throw "Missing $name" }
          }
      - name: Assemble self-contained package and licenses
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist-rescue/runtime,dist-rescue/bridge,dist-rescue/launcher,dist-rescue/licenses,release-rescue | Out-Null
          Copy-Item (Get-Command node).Source dist-rescue/runtime/node.exe
          Copy-Item rescue/bridge/*.js,rescue/bridge/package*.json,rescue/bridge/gifts.json dist-rescue/bridge/
          Copy-Item rescue/bridge/node_modules dist-rescue/bridge/node_modules -Recurse
          Copy-Item rescue/launcher/start.ps1 dist-rescue/launcher/
          Copy-Item rescue/launcher/DEMARRER-MISSION-SAUVETAGE.cmd dist-rescue/
          Copy-Item rescue/README.md dist-rescue/
          Copy-Item rescue/docs/GUIDE_DEMARRAGE.md dist-rescue/GUIDE_DEMARRAGE.txt
          Copy-Item rescue/docs/RECETTE_V05.md dist-rescue/RECETTE_V05.txt
          Copy-Item rescue/game/assets/licenses/* dist-rescue/licenses/
          $env:RESCUE_LICENSE_DIR = (Resolve-Path dist-rescue/licenses).Path
          & $env:RESCUE_GODOT --headless --path rescue/game --script ((Resolve-Path rescue/tools/export_licenses.gd).Path)
          if ($LASTEXITCODE -ne 0) { throw 'Godot license export failed' }
          $nodeVersion = (& node --version).Trim()
          Invoke-WebRequest "https://raw.githubusercontent.com/nodejs/node/$nodeVersion/LICENSE" -OutFile dist-rescue/licenses/NODE-LICENSE.txt
          "Version: 0.5.0`nCommit: $env:GITHUB_SHA`nBuild: $env:GITHUB_RUN_ID`nGodot: 4.5.2`nNode: $nodeVersion" | Set-Content dist-rescue/BUILD.txt -Encoding utf8
      - name: Smoke test packaged launcher and executable
        timeout-minutes: 3
        run: |
          $ErrorActionPreference = 'Stop'
          & ./dist-rescue/launcher/start.ps1 -SmokeTest
          $log = Join-Path $env:LOCALAPPDATA 'MissionSauvetageLIVE/logs/game.log'
          if (-not (Test-Path $log)) { throw 'Game did not create a log' }
          Copy-Item $log qa-logs/portable-smoke.log
          if (Select-String $log -Pattern 'SCRIPT ERROR|Parse Error|Invalid call|^ERROR:' -Quiet) { throw 'Packaged game runtime error' }
      - name: Create portable ZIP
        run: Compress-Archive dist-rescue/* release-rescue/MISSION-SAUVETAGE-LIVE-0.5.0-Portable-x64.zip -Force
      - name: Install Inno Setup
        run: |
          choco install innosetup -y --no-progress
          if ($LASTEXITCODE -ne 0) { throw 'Inno Setup unavailable' }
      - name: Build installer
        run: |
          $ErrorActionPreference = 'Stop'
          $compiler = Get-ChildItem 'C:/Program Files (x86)/Inno Setup */ISCC.exe','C:/Program Files/Inno Setup */ISCC.exe' -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $compiler) { throw 'ISCC missing' }
          & $compiler.FullName rescue/installer/mission-sauvetage.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
      - name: Install and test installed launcher
        timeout-minutes: 4
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Resolve-Path release-rescue/MISSION-SAUVETAGE-LIVE-0.5.0-Setup-x64.exe).Path
          $destination = Join-Path $env:RUNNER_TEMP 'Rescue Install QA'
          $installLog = Join-Path $PWD 'qa-logs/install.log'
          $process = Start-Process $setup -ArgumentList @('/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',('/DIR="'+$destination+'"'),('/LOG="'+$installLog+'"')) -PassThru -Wait
          if ($process.ExitCode -ne 0) { throw "Install failed: $($process.ExitCode)" }
          & (Join-Path $destination 'launcher/start.ps1') -SmokeTest
          $log = Join-Path $env:LOCALAPPDATA 'MissionSauvetageLIVE/logs/game.log'
          Copy-Item $log qa-logs/installed-smoke.log
          if (Select-String $log -Pattern 'SCRIPT ERROR|Parse Error|Invalid call|^ERROR:' -Quiet) { throw 'Installed game runtime error' }
          $manifest = Get-ChildItem release-rescue/* | Get-FileHash -Algorithm SHA256 | ForEach-Object { $_.Hash.ToLower() + '  ' + (Split-Path $_.Path -Leaf) }
          $manifest | Set-Content release-rescue/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: MISSION-SAUVETAGE-LIVE-0.5.0-WINDOWS
          path: release-rescue/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RESCUE-WINDOWS-QA
          path: qa-logs/
